[env:jc3636w518c]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
; Let PlatformIO detect the serial port (Linux: /dev/ttyACM*, macOS: /dev/cu.usbmodem*).

board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE
  ; Раскомментируйте для диагностики BLE/ELM через `pio device monitor`:
  ; -DSMARTDASH_SERIAL_DEBUG=1

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  h2zero/NimBLE-Arduino@^2.1.0
  bblanchon/ArduinoJson@^7.4.2

; Vendor demo reference (local, gitignored): JC3636W518EN/
